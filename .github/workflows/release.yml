name: Package desktop connector
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: aarch64-apple-darwin, platform: darwin-arm64 }
          - { runner: macos-14, target: x86_64-apple-darwin, platform: darwin-x64 }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.90.0 build --locked --release --bin flow-bnb --target ${{ matrix.target }}
      - name: Collect binary
        run: |
          mkdir -p dist/native/${{ matrix.platform }}
          cp target/${{ matrix.target }}/release/flow-bnb dist/native/${{ matrix.platform }}/flow-bnb
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: dist/native/
  package:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist/native
      - run: npm ci --prefix packaging --ignore-scripts --no-audit --no-fund
      - name: Validate tag and launcher
        run: |
          node --test packaging/desktop/*.test.mjs
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            node -e 'const p=require("./packaging/desktop/package.json"); if (process.env.GITHUB_REF_NAME !== "v"+p.version) process.exit(1)'
          fi
      - run: node packaging/build.mjs
      - run: node packaging/acceptance.mjs dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: flow-bnb-desktop-release
          path: |
            dist/release/*.tgz
            dist/release/*.zip
            dist/release/*.mcpb
            dist/release/install-flow-bnb.*
            dist/release/SHA256SUMS
      # The user may have published the release while creating its tag in the UI.
      # Reuse that release; create a draft only when the tag has no release yet.
      - name: Attach release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/release/*.tgz dist/release/*.zip dist/release/*.mcpb dist/release/install-flow-bnb.* dist/release/SHA256SUMS --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/release/*.tgz dist/release/*.zip dist/release/*.mcpb dist/release/install-flow-bnb.* dist/release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Flow BNB $GITHUB_REF_NAME" --notes "Multi-client installer, Claude Desktop bundle and WorkBuddy connector. Publish all assets together after platform acceptance."
          fi
    permissions:
      contents: write
