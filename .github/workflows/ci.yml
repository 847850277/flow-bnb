name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.90.0 fmt --all -- --check
      - run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.90.0 test --locked --all-targets
      - run: cargo +1.90.0 run --locked -- check flows/rwa_discovery.http.yml
