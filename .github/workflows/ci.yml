name: CI

on:
  push:
  pull_request:

jobs:
  mobile-wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wallet-mobile/package-lock.json
      - run: npm ci --ignore-scripts --prefix wallet-mobile
      - run: npm run build --prefix wallet-mobile
      - run: npm test --prefix wallet-mobile
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.90.0 fmt --all -- --check
      - run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.90.0 test --locked --all-targets
      - name: Compile every bundled flow
        run: |
          for file in flows/*.http.yml; do
            cargo +1.90.0 run --locked -- check "$file"
          done
      - name: Offline MCP and operator wallet handoff
        run: |
          cargo +1.90.0 build --locked --bins
          for scenario in success decline wallet-reject timeout expired wrong-chain cancel; do
            python3 scripts/demo_handoff.py --self-test --no-build --scenario "$scenario"
          done
