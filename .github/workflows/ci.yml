name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test packaging/desktop/launcher.test.mjs
      - run: cargo +1.90.0 fmt --all -- --check
      - run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.90.0 test --locked --all-targets
      - name: Compile every bundled flow
        run: |
          for file in flows/*.http.yml; do
            cargo +1.90.0 run --locked -- check "$file"
          done
      - name: Smoke test the packaged MCP without Rust on PATH
        run: |
          mkdir -p dist/native/linux-x64
          cp target/debug/flow-bnb dist/native/linux-x64/flow-bnb
          node packaging/build.mjs --local
          node packaging/acceptance.mjs dist/release
