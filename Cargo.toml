[package]
name = "flow-bnb"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
default-run = "flow-bnb"
description = "Auditable, declarative transaction workflows for BNB Chain"
license = "MIT"
repository = "https://github.com/847850277/flow-bnb"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hmac = "0.12"
num-bigint = "0.4"
postman-flow = { git = "https://github.com/847850277/postman-gpui", rev = "ff26f772a5761a018cfc39b3976b1e49ce850e49" }
postman-http = { git = "https://github.com/847850277/postman-gpui", rev = "ff26f772a5761a018cfc39b3976b1e49ce850e49" }
postman-request = { git = "https://github.com/847850277/postman-gpui", rev = "ff26f772a5761a018cfc39b3976b1e49ce850e49" }
rmcp = { version = "3.4", features = ["schemars", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
tempfile = "3"
