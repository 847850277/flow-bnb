schema_version: 1
# One evaluation: quote -> exact decimal threshold -> candidate intent.
# No API key needed. The local adapter never signs or submits.
flow:
  name: aaplon-minimum-receive
  inputs:
    - name: intent
      default:
        from_token: '0x55d398326f99059fF775485246999027B3197955'
        to_token: '0x390a684ef9cade28a7ad0dfa61ab1eb3842618c4'
        amount: '6'
        slippage_bps: 50
    - name: min_receive
      default: '0.02'
  steps:
    - id: quote
      request:
        kind: http
        method: POST
        url: {literal: 'https://flow-bnb.invalid/strategy/quote'}
        body:
          kind: json
          value: {input: intent}
      checks:
        - {kind: status, equals: 200}
        - {kind: jsonpath, path: '$.success', equals: {literal: true}}
      exports:
        - {name: receive, path: '$.data.toCoinAmount'}
    - id: threshold
      request:
        kind: http
        method: POST
        url: {literal: 'https://flow-bnb.invalid/strategy/compare'}
        body:
          kind: json
          value:
            object:
              left: {output: {step: quote, name: receive}}
              operator: {literal: gte}
              right: {input: min_receive}
      checks:
        - {kind: status, equals: 200}
        - {kind: jsonpath, path: '$.success', equals: {literal: true}}
      exports:
        - {name: matched, path: '$.data.matched'}
    - id: decision
      request:
        kind: http
        method: POST
        url: {literal: 'https://flow-bnb.invalid/strategy/decision'}
        body:
          kind: json
          value:
            object:
              triggered: {output: {step: threshold, name: matched}}
              intent: {input: intent}
      checks:
        - {kind: status, equals: 200}
        - {kind: jsonpath, path: '$.success', equals: {literal: true}}
  outputs:
    - name: quoted_receive
      value: {output: {step: quote, name: receive}}
    - name: threshold_met
      value: {output: {step: threshold, name: matched}}
