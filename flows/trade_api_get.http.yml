schema_version: 1
# Internal stage used by prepare-trade. The Rust adapter validates endpoints and
# binds API evidence to policy before a signing action can be produced.
flow:
  name: bnb-trade-api-get
  inputs:
    - name: url
  steps:
    - id: request
      request:
        kind: http
        method: GET
        url: { input: url }
      checks:
        - kind: status
          equals: 200
        - kind: jsonpath
          path: $.code
          equals: { literal: 0 }
      exports:
        - name: data
          path: $.data
          sensitive: true
  outputs:
    - name: data
      value: { output: { step: request, name: data } }
