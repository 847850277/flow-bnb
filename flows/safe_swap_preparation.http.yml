schema_version: 1
# Only ordinary SWAP routes; RFQ stock orders require prepare-trade diagnostics.
# 用途：获取兑换报价 → 构建未签名交易 → 模拟执行；当前不包含授权、签名或广播。
flow:
  name: bnb-safe-swap-preparation
  # 输入：from/to_token_address 是卖出/买入代币的合约；wallet_address 是交易发起钱包。
  # amount 使用卖出代币的最小单位，例如 6 位小数代币的 1000000 表示 1 枚。
  # slippage_percent 默认 0.5，表示允许 0.5% 滑点；chain_id 默认 BSC 主网 56。
  inputs:
    - name: host
      default: https://web3.binance.com/build
    - name: chain_id
      default: "56"
    - name: from_token_address
    - name: to_token_address
    - name: amount
    - name: wallet_address
    - name: slippage_percent
      default: "0.5"
  steps:
    # 第 1 步：向聚合交易 API 查询指定数量的兑换报价，使用返回列表中的第一条路线。
    # 检查 HTTP 200、业务码 0，并确认报价所属链与输入一致。
    # 保存报价 ID、交易提供方、预计买入数量和价格影响；报价 ID 将用于构建交易。
    - id: quote
      name: Request aggregated spot routes
      request:
        kind: http
        method: GET
        url:
          concat:
            - input: host
            - literal: /api/v1/dex/aggregator/quote?binanceChainId=
            - input: chain_id
            - literal: '&amount='
            - input: amount
            - literal: '&fromTokenAddress='
            - input: from_token_address
            - literal: '&toTokenAddress='
            - input: to_token_address
            - literal: '&userWalletAddress='
            - input: wallet_address
      checks:
        - kind: status
          equals: 200
        - kind: jsonpath
          path: $.code
          equals: { literal: 0 }
        - kind: jsonpath
          path: $.data[0].binanceChainId
          equals: { input: chain_id }
        - kind: jsonpath
          path: $.data[0].executionMode
          equals: { literal: SWAP }
      exports:
        - name: quote_id
          path: $.data[0].quoteId
        - name: vendor_name
          path: $.data[0].vendorName
        - name: to_token_amount
          path: $.data[0].toTokenAmount
        - name: price_impact_percent
          path: $.data[0].priceImpactPercent
    # 第 2 步：沿用上一步报价 ID、代币、数量和钱包，生成未签名的兑换交易。
    # 同时传入允许的滑点，提取 from/to/data/value 和最低接收数量。
    # data 是合约调用数据，标记为敏感输出；这里仅构建交易，不会真的兑换。
    - id: build-swap
      name: Build unsigned swap calldata from the selected route
      request:
        kind: http
        method: GET
        url:
          concat:
            - input: host
            - literal: /api/v1/dex/aggregator/swap?binanceChainId=
            - input: chain_id
            - literal: '&amount='
            - input: amount
            - literal: '&fromTokenAddress='
            - input: from_token_address
            - literal: '&toTokenAddress='
            - input: to_token_address
            - literal: '&userWalletAddress='
            - input: wallet_address
            - literal: '&quoteId='
            - output: { step: quote, name: quote_id }
            - literal: '&slippagePercent='
            - input: slippage_percent
      checks:
        - kind: status
          equals: 200
        - kind: jsonpath
          path: $.code
          equals: { literal: 0 }
        - kind: jsonpath
          path: $.data.executionMode
          equals: { literal: SWAP }
      exports:
        - name: tx_from
          path: $.data.tx.from
        - name: tx_to
          path: $.data.tx.to
        - name: tx_data
          path: $.data.tx.data
          sensitive: true
        - name: tx_value
          path: $.data.tx.value
        - name: min_receive_amount
          path: $.data.tx.minReceiveAmount
    # 第 3 步：把上一步的原始交易字段交给模拟接口，预估执行结果。
    # 除 HTTP 200 和业务码 0 外，还要求模拟状态为 SUCCESS，否则流程失败。
    # 提取预计余额和授权额度变化；模拟成功不代表已成交，也不代表独立策略模块已放行。
    - id: simulate
      name: Simulate the unsigned BSC transaction before signing
      request:
        kind: http
        method: POST
        url:
          concat:
            - input: host
            - literal: /api/v1/dex/pre-transaction/simulate
        headers:
          - name: { literal: Content-Type }
            value: { literal: application/json }
        body:
          kind: json
          value:
            object:
              binanceChainId: { input: chain_id }
              evmTx:
                object:
                  from: { output: { step: build-swap, name: tx_from } }
                  to: { output: { step: build-swap, name: tx_to } }
                  value: { output: { step: build-swap, name: tx_value } }
                  data: { output: { step: build-swap, name: tx_data } }
      checks:
        - kind: status
          equals: 200
        - kind: jsonpath
          path: $.code
          equals: { literal: 0 }
        - kind: jsonpath
          path: $.data.status
          equals: { literal: SUCCESS }
      exports:
        - name: simulation_status
          path: $.data.status
        - name: balance_changes
          path: $.data.balanceChanges
        - name: allowance_changes
          path: $.data.allowanceChanges
  # 最终结果：返回报价、最低接收数量、模拟状态及预计变化，供后续策略检查和执行使用。
  outputs:
    - name: chain_id
      value: { input: chain_id }
    - name: quote_id
      value: { output: { step: quote, name: quote_id } }
    - name: vendor_name
      value: { output: { step: quote, name: vendor_name } }
    - name: to_token_amount
      value: { output: { step: quote, name: to_token_amount } }
    - name: price_impact_percent
      value: { output: { step: quote, name: price_impact_percent } }
    - name: min_receive_amount
      value: { output: { step: build-swap, name: min_receive_amount } }
    - name: simulation_status
      value: { output: { step: simulate, name: simulation_status } }
    - name: balance_changes
      value: { output: { step: simulate, name: balance_changes } }
    - name: allowance_changes
      value: { output: { step: simulate, name: allowance_changes } }
